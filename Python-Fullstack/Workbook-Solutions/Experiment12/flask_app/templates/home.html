<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            color: white;
            margin-top: 100px;
        }
        .card {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            margin: auto;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }
        a {
            display: block;
            margin: 15px;
            padding: 10px;
            background: #4facfe;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background: #0077ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Department Portal</h1>
        <a href="/department">View Department</a>
        <a href="/greet">Enter Your Name</a>
    </div>
</body>
</html>
