<!DOCTYPE html>
<html>
<head>
    <title>Greeting</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #43e97b, #38f9d7);
            text-align: center;
            padding-top: 80px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
        }
        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #43e97b;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #2ecc71;
        }
        .greet {
            margin-top: 20px;
            font-size: 20px;
            color: #333;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Enter Your Name</h2>

        <form method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <br>
            <button type="submit">Submit</button>
        </form>

        {% if username %}
            <div class="greet">
                Hello, <b>{{ username }}</b>! 👋 <br>
                Welcome to the Electical and Electronic communication Department.
            </div>
        {% endif %}

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
