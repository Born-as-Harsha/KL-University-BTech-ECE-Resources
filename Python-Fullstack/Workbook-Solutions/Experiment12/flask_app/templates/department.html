<!DOCTYPE html>
<html>
<head>
    <title>Department</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f7fc;
            text-align: center;
            padding-top: 80px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
        }
        h2 {
            color: #333;
        }
        p {
            font-size: 18px;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background: #4facfe;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background: #0077ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Department Details</h2>
        <p><b>Name:</b> {{ dept.name }}</p>
        <p><b>HOD:</b> {{ dept.hod }}</p>
        <p><b>Total Students:</b> {{ dept.students }}</p>

        <a href="/">Back</a>
    </div>
</body>
</html>
