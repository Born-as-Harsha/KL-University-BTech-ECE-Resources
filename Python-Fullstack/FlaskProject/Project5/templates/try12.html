<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            height: 100vh;
        }

        .card {
            border-radius: 25px;
            border: none;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 12px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card shadow-lg p-5" style="width: 420px;">

    <!-- Title -->
    <div class="text-center mb-4 title">
        🎓 Add Student Details
    </div>

    <!-- Form -->
    <form action="{{ url_for('add_student') }}" method="POST">

        <div class="mb-3">
            <label class="form-label">Registration Number</label>
            <input type="number" class="form-control" name="regnum" placeholder="Enter Registration Number" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter Name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Subject 1</label>
            <input type="text" class="form-control" name="subject1" placeholder="Enter Subject Name">
        </div>

        <div class="mb-3">
            <label class="form-label">Subject 2</label>
            <input type="text" class="form-control" name="subject2" placeholder="Enter Subject Name">
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-custom">
                💾 Save Student
            </button>
        </div>

    </form>

</div>

</body>
</html>
