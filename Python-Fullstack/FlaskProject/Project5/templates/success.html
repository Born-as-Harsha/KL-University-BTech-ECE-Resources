<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            height: 100vh;
        }

        .card {
            border-radius: 25px;
            border: none;
            backdrop-filter: blur(10px);
        }

        .success-icon {
            font-size: 60px;
        }

        .success-text {
            font-size: 24px;
            font-weight: 600;
            color: #28a745;
        }

        .btn-custom {
            border-radius: 12px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .sub-text {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card shadow-lg text-center p-5" style="width: 420px;">

    <!-- Icon -->
    <div class="success-icon mb-3">✅</div>

    <!-- Main Text -->
    <div class="success-text mb-2">
        Data Inserted Successfully
    </div>

    <!-- Sub text -->
    <div class="sub-text mb-4">
        Your student record has been saved in the database.
    </div>

    <!-- Button -->
    <a href="{{ url_for('next1') }}" class="btn btn-primary btn-custom">
        ➕ Insert Another Record
    </a>

</div>

</body>
</html>
