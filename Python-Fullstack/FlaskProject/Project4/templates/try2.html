<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Time Result</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            height: 100vh;
            color: white;
        }

        .card {
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.8);
        }

        .time-text {
            font-size: 40px;
            font-weight: bold;
            color: #00ffcc;   /* Bright neon color */
            letter-spacing: 2px;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">

<div class="card text-center shadow-lg p-5" style="width: 500px;">
    
    <div class="title mb-3">🕒 Current Time</div>

    <!-- TIME DISPLAY -->
    <div class="time-text">
        {{ t }}
    </div>

    <br><br>

    <a href="/" class="btn btn-light">⬅ Back</a>

</div>

</body>
</html>
