<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #43cea2, #185a9d);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #185a9d;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #43cea2;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #2bbf91;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome, {{ name }} 🎉</h1>
        <p>You have successfully logged in.</p>

        <button class="btn" onclick="window.location.href='/'">
            Logout
        </button>
    </div>

</body>
</html>
